spring.main.lazy-initialization=true
spring.jmx.enabled=false

spring.datasource.hikari.maximum-pool-size=${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:3}
spring.datasource.hikari.minimum-idle=${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:1}
spring.datasource.hikari.connection-timeout=${SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT:15000}
spring.datasource.hikari.idle-timeout=${SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT:30000}
spring.datasource.hikari.max-lifetime=${SPRING_DATASOURCE_HIKARI_MAX_LIFETIME:600000}
spring.datasource.hikari.keepalive-time=${SPRING_DATASOURCE_HIKARI_KEEPALIVE_TIME:0}
spring.datasource.hikari.register-mbeans=false

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.generate_statistics=false
spring.jpa.properties.hibernate.cache.use_second_level_cache=false
spring.jpa.properties.hibernate.cache.use_query_cache=false
spring.jpa.properties.hibernate.query.plan_cache_max_size=${HIBERNATE_QUERY_PLAN_CACHE_MAX_SIZE:64}
spring.jpa.properties.hibernate.query.plan_parameter_metadata_max_size=${HIBERNATE_QUERY_PLAN_PARAMETER_METADATA_MAX_SIZE:16}

spring.task.execution.pool.core-size=${SPRING_TASK_EXECUTION_POOL_CORE_SIZE:1}
spring.task.execution.pool.max-size=${SPRING_TASK_EXECUTION_POOL_MAX_SIZE:2}
spring.task.execution.pool.queue-capacity=${SPRING_TASK_EXECUTION_POOL_QUEUE_CAPACITY:25}
spring.task.execution.pool.keep-alive=${SPRING_TASK_EXECUTION_POOL_KEEP_ALIVE:30s}
spring.task.execution.thread-name-prefix=totem-async-
spring.task.execution.shutdown.await-termination=true
spring.task.execution.shutdown.await-termination-period=10s
spring.task.scheduling.pool.size=1
spring.task.scheduling.thread-name-prefix=totem-sched-

server.tomcat.threads.max=${SERVER_TOMCAT_THREADS_MAX:20}
server.tomcat.threads.min-spare=${SERVER_TOMCAT_THREADS_MIN_SPARE:2}
server.tomcat.max-connections=${SERVER_TOMCAT_MAX_CONNECTIONS:128}
server.tomcat.accept-count=${SERVER_TOMCAT_ACCEPT_COUNT:20}
server.tomcat.mbeanregistry.enabled=false

spring.servlet.multipart.file-size-threshold=1MB

logging.level.root=WARN
logging.level.br.lunavita.totemapi=INFO
logging.level.br.lunavita.totemapi.config.JwtAuthenticationFilter=WARN
logging.level.br.lunavita.totemapi.service.DataAccessAuditService=WARN
logging.level.br.lunavita.totemapi.controller.WebhookController=WARN
logging.level.br.lunavita.totemapi.controller.CrmWebhookController=WARN
logging.level.br.lunavita.totemapi.controller.GhlWebhookPatientController=WARN
logging.level.br.lunavita.totemapi.controller.GhlWebhookAppointmentController=WARN
logging.level.br.lunavita.totemapi.service.WebhookConfigService=WARN
logging.level.br.lunavita.totemapi.service.ResendEmailService=WARN
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
logging.level.com.zaxxer.hikari=WARN
logging.level.org.apache.catalina=WARN
